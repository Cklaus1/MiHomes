[alembic]
script_location = alembic

# Phase 0 landing app — a SEPARATE migration tree, run with `alembic -n landing`.
#
# SPEC-001 D1 makes the landing app standalone ("shares the stack and nothing
# else") and D3 gives it a database whose only table is `waitlist`. It therefore
# must not replay the single-user product's 40 revisions: that would create all
# 37 tables in the landing database, and it does not work anyway — those
# revisions are SQLite-only (measured: the chain dies on a native-enum literal in
# e5f6a7b8c9d0). SPEC-002 Step 6 squashes and archives them.
[landing]
script_location = alembic_landing

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
