services:
  mihomes:
    build: .
    environment:
      MIHOMES_DEMO: "1"
      MIHOMES_DIR: /data/mihomes
    volumes:
      - mihomes-data:/data/mihomes
      - ./scripts/start-mihomes.sh:/start.sh:ro
    ports:
      - "8080:8080"
    command: ["sh", "/start.sh"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/properties')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./ha-config:/config
      - ./custom_components/mihomes:/config/custom_components/mihomes:ro
    ports:
      - "8123:8123"
    depends_on:
      mihomes:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mihomes-data:
