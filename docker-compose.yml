services:
  # Local Postgres for development and running the test suite (SPEC-002 D12): D1 removed the
  # zero-setup SQLite path, so `mihomes-dev` and `pytest` now need a real Postgres reachable at
  # DATABASE_URL/TEST_DATABASE_URL. `docker compose up -d postgres` gives one without installing
  # Postgres by hand. Not wired into the `mihomes` service below — that still runs on the SQLite
  # demo path (MIHOMES_DEMO=1), which is a separate, pre-existing gap (launch gate S7) this change
  # does not take on.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mihomes
    ports:
      - "5432:5432"
    volumes:
      - mihomes-postgres-data:/var/lib/postgresql/data
      # Creates mihomes_test and mihomes_phase0 alongside the default `mihomes` database, once,
      # the first time the volume above is initialized — see the script for why three databases.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mihomes:
    build: .
    environment:
      MIHOMES_DEMO: "1"
      MIHOMES_DIR: /data/mihomes
    volumes:
      - mihomes-data:/data/mihomes
      - ./scripts/start-mihomes.sh:/start.sh:ro
    ports:
      - "8080:8080"
    command: ["sh", "/start.sh"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/properties')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./ha-config:/config
      - ./custom_components/mihomes:/config/custom_components/mihomes:ro
    ports:
      - "8123:8123"
    depends_on:
      mihomes:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mihomes-data:
  mihomes-postgres-data:
