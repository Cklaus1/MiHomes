# ── Lovelace: new format (fixes deprecation, removes duplicate Overview) ───────
lovelace:
  resource_mode: yaml
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: MiHomes
      icon: mdi:home-city
      show_in_sidebar: true
      require_admin: false
