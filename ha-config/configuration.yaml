homeassistant:
  name: MiHomes Estate
  unit_system: imperial
  time_zone: America/New_York

default_config:

# ── Lights (toggleable per property per room) ─────────────────────────────────
input_boolean:
  # Beach House
  bh_light_living_room:
    name: "Living Room"
    icon: mdi:ceiling-light
  bh_light_kitchen:
    name: "Kitchen"
    icon: mdi:ceiling-light
  bh_light_master_bedroom:
    name: "Master Bedroom"
    icon: mdi:ceiling-light
  bh_light_guest_bedroom:
    name: "Guest Bedroom"
    icon: mdi:ceiling-light
  bh_light_office:
    name: "Office"
    icon: mdi:desk-lamp
  bh_light_garage:
    name: "Garage"
    icon: mdi:garage
  bh_light_outdoor:
    name: "Outdoor"
    icon: mdi:outdoor-lamp
  # Mountain Lodge
  ml_light_great_room:
    name: "Great Room"
    icon: mdi:ceiling-light
  ml_light_master_suite:
    name: "Master Suite"
    icon: mdi:ceiling-light
  ml_light_deck:
    name: "Deck"
    icon: mdi:outdoor-lamp
  ml_light_garage:
    name: "Garage"
    icon: mdi:garage
  # City Apartment
  ca_light_living_room:
    name: "Living Room"
    icon: mdi:ceiling-light
  ca_light_bedroom:
    name: "Bedroom"
    icon: mdi:ceiling-light
  ca_light_kitchen:
    name: "Kitchen"
    icon: mdi:ceiling-light

# ── Thermostat setpoints ──────────────────────────────────────────────────────
input_number:
  bh_heat_setpoint:
    name: "Heat Setpoint"
    min: 60
    max: 78
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-chevron-up
  bh_cool_setpoint:
    name: "Cool Setpoint"
    min: 68
    max: 85
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-chevron-down
  ml_heat_setpoint:
    name: "Heat Setpoint"
    min: 58
    max: 75
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-chevron-up
  ca_heat_setpoint:
    name: "Heat Setpoint"
    min: 62
    max: 78
    step: 1
    unit_of_measurement: "°F"
    mode: box
    icon: mdi:thermometer-chevron-up

# ── HVAC mode & staff status (interactive selects) ───────────────────────────
input_select:
  bh_hvac_mode:
    name: "BH HVAC Mode"
    options: [Heat, Cool, Auto, "Off"]
    icon: mdi:hvac
  ml_hvac_mode:
    name: "ML HVAC Mode"
    options: [Heat, Cool, Auto, "Off"]
    icon: mdi:hvac
  ca_hvac_mode:
    name: "CA HVAC Mode"
    options: [Heat, Cool, Auto, "Off"]
    icon: mdi:hvac

  # Staff duty status
  staff_maria_santos:
    name: "Maria Santos"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "On Duty"
    icon: mdi:account-circle
  staff_james_okafor:
    name: "James Okafor"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "On Duty"
    icon: mdi:account-circle
  staff_elena_cruz:
    name: "Elena Cruz"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "On Duty"
    icon: mdi:account-circle
  staff_david_park:
    name: "David Park"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "Scheduled"
    icon: mdi:account-circle
  staff_patricia_webb:
    name: "Patricia Webb"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "On Duty"
    icon: mdi:account-star
  staff_robert_nash:
    name: "Robert Nash"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "Scheduled"
    icon: mdi:account-circle
  staff_yuki_tanaka:
    name: "Yuki Tanaka"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "Scheduled"
    icon: mdi:account-circle
  staff_carlos_diaz:
    name: "Carlos Diaz"
    options: ["On Duty", "Scheduled", "Off Duty", "On Leave"]
    initial: "On Duty"
    icon: mdi:account-circle

  # Vendor status
  vendor_aquapure:
    name: "AquaPure Pools"
    options: ["En Route", "On Site", "Completed", "Scheduled", "Inactive"]
    initial: "En Route"
    icon: mdi:pool
  vendor_blueline_hvac:
    name: "BlueLine HVAC"
    options: ["En Route", "On Site", "Completed", "Scheduled", "Inactive"]
    initial: "Scheduled"
    icon: mdi:air-conditioner
  vendor_summit_roofing:
    name: "Summit Roofing"
    options: ["En Route", "On Site", "Completed", "Scheduled", "Inactive"]
    initial: "Scheduled"
    icon: mdi:home-roof

# ── All template sensors and binary sensors ───────────────────────────────────
template:
  - sensor:
      # ── Environment: Beach House ───────────────────────────────────────────
      - name: "BH Indoor Temperature"
        state: "72"
        unit_of_measurement: "°F"
        device_class: temperature
      - name: "BH Indoor Humidity"
        state: "54"
        unit_of_measurement: "%"
        device_class: humidity
      - name: "BH Outdoor Temperature"
        state: "68"
        unit_of_measurement: "°F"
        device_class: temperature
      - name: "BH Energy Today"
        state: "14.2"
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:lightning-bolt
      - name: "BH Solar Today"
        state: "8.7"
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-panel
      - name: "BH Water Usage Today"
        state: "48"
        unit_of_measurement: "gal"
        icon: mdi:water

      # ── Environment: Mountain Lodge ────────────────────────────────────────
      - name: "ML Indoor Temperature"
        state: "64"
        unit_of_measurement: "°F"
        device_class: temperature
      - name: "ML Indoor Humidity"
        state: "38"
        unit_of_measurement: "%"
        device_class: humidity
      - name: "ML Outdoor Temperature"
        state: "41"
        unit_of_measurement: "°F"
        device_class: temperature

      # ── Environment: City Apartment ────────────────────────────────────────
      - name: "CA Indoor Temperature"
        state: "70"
        unit_of_measurement: "°F"
        device_class: temperature
      - name: "CA Indoor Humidity"
        state: "49"
        unit_of_measurement: "%"
        device_class: humidity

      # ── Estate health scores ───────────────────────────────────────────────
      - name: "Beach House Health Score"
        state: "84"
        unit_of_measurement: "%"
        icon: mdi:home-heart
      - name: "Mountain Lodge Health Score"
        state: "71"
        unit_of_measurement: "%"
        icon: mdi:home-heart
      - name: "City Apartment Health Score"
        state: "93"
        unit_of_measurement: "%"
        icon: mdi:home-heart

      # ── Issue & task counts ────────────────────────────────────────────────
      - name: "Beach House Open Issues"
        state: "3"
        icon: mdi:alert-circle-outline
      - name: "Mountain Lodge Open Issues"
        state: "5"
        icon: mdi:alert-circle-outline
      - name: "City Apartment Open Issues"
        state: "1"
