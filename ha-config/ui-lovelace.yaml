title: MiHomes Estate
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # OVERVIEW — Portfolio snapshot
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Overview
    path: home
    icon: mdi:home-city
    cards:

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.mihomes_critical_issue
            state: "on"
        card:
          type: tile
          entity: binary_sensor.mihomes_critical_issue
          name: "Critical Issue — Immediate Attention Required"
          icon: mdi:alert-circle
          color: red

      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.beach_house_health_score
            name: Beach House
            min: 0
            max: 100
            needle: true
            severity:
              green: 75
              yellow: 50
              red: 0
          - type: gauge
            entity: sensor.mountain_lodge_health_score
            name: Mountain Lodge
            min: 0
            max: 100
            needle: true
            severity:
              green: 75
              yellow: 50
              red: 0
          - type: gauge
            entity: sensor.city_apartment_health_score
            name: City Apartment
            min: 0
            max: 100
            needle: true
            severity:
              green: 75
              yellow: 50
              red: 0

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.mihomes_active_alerts
            name: Active Alerts
            icon: mdi:bell-alert
            color: red
          - type: tile
            entity: sensor.mihomes_overdue_tasks
            name: Overdue Tasks
            icon: mdi:clock-alert
            color: orange
          - type: tile
            entity: sensor.active_staff_count
            name: Active Staff
            icon: mdi:account-group
            color: blue
          - type: tile
            entity: sensor.vendors_on_site_today
            name: Vendors On Site
            icon: mdi:truck
            color: green

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: binary_sensor.beach_house_has_issues
            name: Beach House
            icon: mdi:beach
          - type: tile
            entity: binary_sensor.mountain_lodge_has_issues
            name: Mountain Lodge
            icon: mdi:pine-tree
          - type: tile
            entity: binary_sensor.city_apartment_has_issues
            name: City Apartment
            icon: mdi:city-variant

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.beach_house_open_issues
            name: BH Open Issues
            icon: mdi:alert-circle-outline
          - type: entity
            entity: sensor.mountain_lodge_open_issues
            name: ML Open Issues
            icon: mdi:alert-circle-outline
          - type: entity
            entity: sensor.city_apartment_open_issues
            name: CA Open Issues
            icon: mdi:alert-circle-outline

      - type: grid
        columns: 3
        square: false
        cards:
          - type: entity
            entity: sensor.beach_house_open_tasks
            name: BH Open Tasks
            icon: mdi:checkbox-marked-circle-outline
          - type: entity
            entity: sensor.mountain_lodge_open_tasks
            name: ML Open Tasks
            icon: mdi:checkbox-marked-circle-outline
          - type: entity
            entity: sensor.city_apartment_open_tasks
            name: CA Open Tasks
            icon: mdi:checkbox-marked-circle-outline

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.monthly_budget_remaining
            name: May Budget Left
            icon: mdi:cash
            color: green
          - type: tile
            entity: sensor.ytd_expenses
            name: YTD Expenses
            icon: mdi:chart-line
            color: blue

  # ═══════════════════════════════════════════════════════════════════════════
  # BEACH HOUSE
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Beach House
    path: beach-house
    icon: mdi:beach
    cards:

      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.bh_indoor_temperature
            name: Indoor Temp
            min: 50
            max: 95
            needle: true
            severity:
              green: 68
              yellow: 78
              red: 85
          - type: gauge
            entity: sensor.bh_indoor_humidity
            name: Humidity
            min: 0
            max: 100
            needle: true
            severity:
              green: 40
              yellow: 60
              red: 70
          - type: tile
            entity: sensor.bh_outdoor_temperature
            name: Outdoors
            icon: mdi:thermometer

      - type: entities
        title: Lights
        entities:
          - entity: input_boolean.bh_light_living_room
            name: Living Room
            icon: mdi:ceiling-light
          - entity: input_boolean.bh_light_kitchen
            name: Kitchen
            icon: mdi:ceiling-light
          - entity: input_boolean.bh_light_master_bedroom
            name: Master Bedroom
            icon: mdi:ceiling-light
          - entity: input_boolean.bh_light_guest_bedroom
            name: Guest Bedroom
            icon: mdi:ceiling-light
          - entity: input_boolean.bh_light_office
            name: Office
            icon: mdi:desk-lamp
          - entity: input_boolean.bh_light_garage
            name: Garage
            icon: mdi:garage
          - entity: input_boolean.bh_light_outdoor
            name: Outdoor
            icon: mdi:outdoor-lamp

      - type: entities
        title: Climate
        entities:
          - entity: input_select.bh_hvac_mode
            name: HVAC Mode
          - entity: input_number.bh_heat_setpoint
            name: Heat
          - entity: input_number.bh_cool_setpoint
            name: Cool

      - type: glance
        title: Security
        show_state: true
        entities:
          - entity: binary_sensor.bh_front_door
            name: Front Door
          - entity: binary_sensor.bh_back_door
            name: Back Door
          - entity: binary_sensor.bh_garage_door
            name: Garage Door
          - entity: binary_sensor.bh_master_bedroom_window
            name: Bedroom Win
          - entity: binary_sensor.bh_living_room_window
            name: Living Win
          - entity: binary_sensor.bh_basement_window
            name: Basement Win
          - entity: binary_sensor.bh_living_room_motion
            name: LR Motion
          - entity: binary_sensor.bh_garage_motion
            name: Garage Motion
          - entity: binary_sensor.bh_smoke_detector
            name: Smoke
          - entity: binary_sensor.bh_co_detector
            name: CO

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.bh_energy_today
            name: Energy Today
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.bh_solar_today
            name: Solar Today
            icon: mdi:solar-panel
            color: yellow
          - type: tile
            entity: sensor.bh_water_usage_today
            name: Water Today
            icon: mdi:water

