[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomes"
version = "0.1.0"
description = "AI-first multi-home estate management system"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-slugify>=8.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    # SPEC-001 Phase 0 (landing + waitlist). Postgres is the target engine from
    # Phase 0 onward (D3); the landing app is Postgres-only.
    "psycopg[binary]>=3.2",
    "resend>=2.0",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    # SPEC-003 U1 — at-rest encryption for stored credentials (`mihomes/crypto.py`). Was already
    # present as a transitive dependency of authlib, which is a latent break: a resolver that
    # dropped it, or an authlib release that stopped needing it, would take `mihomes config` with
    # it. Declared because we import it directly.
    "cryptography>=42",
    # SPEC-004 Phase 3 — the billing adapter. Confined to `services/billing/stripe_provider.py`
    # by D2: nothing else in the tree imports it, which is what makes the provider swappable and
    # lets `FakeBillingProvider` cover every criterion without a live Stripe account.
    "stripe>=11.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
nim = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # [tool.pytest.ini_options] sets asyncio_mode = "auto", which silently does
    # NOTHING without this plugin: async tests are then collected and skipped with
    # "async def functions are not natively supported". It was installed on the dev
    # machine but declared nowhere, so the suite only ever passed there.
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
    # Seven tests exercise the openai and nim providers unconditionally
    # (test_ai_services, test_provider_content, test_provider_model, test_room_scan).
    # `openai` was only an optional extra, so a clean `pip install -e ".[dev]"` could
    # not run the suite — those tests failed with "OpenAI SDK not installed" rather
    # than the AIAuthError they assert. Both providers import the same SDK.
    "openai>=1.0",
]

[project.scripts]
mihomes = "mihomes.cli:app"
mihomes-web = "mihomes.web.server:main"
mihomes-dev = "mihomes.web.server:dev"
# Phase 0 landing app — a separate entry point on purpose (D1). Never serve this
# and mihomes-web from the same process: that app has no auth (§7-N1).
mihomes-landing = "mihomes.landing.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length — not enforced; long strings/URLs are common
    "B008",  # function call in default arg — FastAPI Depends()/Form() idiom
    "E701",  # multiple statements on one line — codebase uses compact `if x: kwargs[...] = ...`
]

[tool.coverage.run]
source = ["mihomes"]

[tool.coverage.report]
omit = [
    # AI provider HTTP implementations — require real API credentials
    "*/services/ai/claude_provider.py",
    "*/services/ai/openai_provider.py",
    "*/services/ai/nim_provider.py",
    "*/services/ai/ollama_provider.py",
    # Gateway integrations — SPEC-006 Step 10 (A24) narrowed these from two directory-wide
    # globs to the four modules that genuinely talk to a network.
    #
    # F10's finding: `*/services/gateways/whatsapp/*` and `.../telegram/*` excluded whole
    # directories on a justification true only of the HTTP clients. `review_common.py` sits
    # above those globs and was measured, but the per-channel adapters were not — and D2 makes
    # adapters the extension point for every future channel, so the untested surface was
    # exactly the surface that grows. SPEC-006 then landed `identity.py`, `linking.py` and
    # `webhook.py` — the modules carrying D11/D12's tenancy boundary — inside them.
    #
    # What stays omitted is HTTP and nothing else, on the same reasoning as the AI providers
    # and `stripe_provider.py`: testing that someone else's API works is their job, and the
    # seam worth testing is the Protocol boundary, which the fakes cover without credentials.
    # `tests/unit/test_gateway_cleanup.py` asserts both halves — that each measured module is
    # measured, and that each omission still names a reason.
    "*/services/gateways/whatsapp/client.py",       # the Node/Baileys bridge; goes at Step 9
    "*/services/gateways/whatsapp/cloud_client.py", # Meta Graph API — U8, an accepted gap
    "*/services/gateways/telegram/client.py",       # Telegram Bot API
    "*/services/gateways/calendar/provider.py",
    # SPEC-004 §9 — the Stripe adapter, following the AI-provider precedent above. Testing that
    # the Stripe SDK works is Stripe's job; the seam worth testing is the Protocol boundary, and
    # `FakeBillingProvider` tests that without credentials.
    "*/services/billing/stripe_provider.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
