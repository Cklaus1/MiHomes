[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomes"
version = "0.1.0"
description = "AI-first multi-home estate management system"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-slugify>=8.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
nim = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "httpx>=0.27",
]

[project.scripts]
mihomes = "mihomes.cli:app"
mihomes-web = "mihomes.web.server:main"
mihomes-dev = "mihomes.web.server:dev"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["mihomes"]

[tool.coverage.report]
omit = [
    # AI provider HTTP implementations — require real API credentials
    "*/services/ai/claude_provider.py",
    "*/services/ai/openai_provider.py",
    "*/services/ai/nim_provider.py",
    "*/services/ai/ollama_provider.py",
    # Gateway integrations — require real network connections
    "*/services/gateways/whatsapp/*",
    "*/services/gateways/calendar/provider.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
