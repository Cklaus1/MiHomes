[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mihomes"
version = "0.1.0"
description = "AI-first multi-home estate management system"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-slugify>=8.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
]

[project.scripts]
mihomes = "mihomes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
