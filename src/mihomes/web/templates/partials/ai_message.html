<!-- User message -->
<div class="flex items-start gap-3 justify-end">
  <div class="bg-brand-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-lg text-sm">
    {{ query }}
  </div>
  <div class="w-7 h-7 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0 mt-0.5">
    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
    </svg>
  </div>
</div>

<!-- AI response -->
<div class="flex items-start gap-3">
  <div class="w-7 h-7 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0 mt-0.5">
    <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
    </svg>
  </div>
  <div class="flex-1 min-w-0">
    {% if error %}
    <div class="bg-red-50 border border-red-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-red-700">
      <div class="font-medium mb-0.5">Unable to get a response</div>
      {{ error }}
    </div>
    {% else %}
    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm px-4 py-3 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed max-w-2xl">{{ response_text }}</div>
    {% if active_role %}
    <div class="mt-1.5 ml-1 text-xs text-gray-400">
      {{ active_role.replace('_', ' ').title() }}
    </div>
    {% endif %}
    {% endif %}
  </div>
</div>
