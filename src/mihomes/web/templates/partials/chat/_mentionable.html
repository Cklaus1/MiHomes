{# The @-picker. Expects: people (Mentionable, visible members only). Names are autoescaped;
   chat.js reads them from data attributes, never from HTML. #}
{% if people %}
<ul role="listbox" aria-label="Mention someone" class="py-1">
  {% for p in people %}
  <li role="option">
    <button type="button" data-chat-mention-id="{{ p.membership_id }}" data-chat-mention-name="{{ p.name }}"
            class="w-full text-left min-h-[36px] px-3 text-sm text-gray-800 hover:bg-gray-100">{{ p.name }}</button>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="px-3 py-2 text-xs text-gray-500">No one in this chat matches.</p>
{% endif %}
