{# Optional file picker for the Documents add/edit forms. Accepts what `read_document_upload` allows;
   `docFileChosen` (documents.html) checks the size before anything is sent. #}
<div data-doc-file>
  <label class="flex items-center gap-2 border border-gray-200 rounded-lg px-3 py-2 bg-white cursor-pointer hover:border-brand-400 focus-within:ring-2 focus-within:ring-brand-500 transition-colors">
    <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
    </svg>
    <span class="text-sm text-gray-500 truncate" data-file-label>Choose a PDF or image…</span>
    <input type="file" name="file" class="sr-only" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp"
           data-max-bytes="{{ max_doc_bytes }}" onchange="docFileChosen(this)" />
  </label>
  <p class="hidden text-xs text-red-600 mt-1" data-file-error role="alert"></p>
  <p class="text-xs text-gray-500 mt-1">PDF, JPG, PNG, GIF or WebP, up to {{ (max_doc_bytes // 1000000) }} MB.</p>
</div>
