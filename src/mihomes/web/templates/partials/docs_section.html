{# Reusable documents section. Expects: docs, post_url, delete_url_prefix #}
<div class="space-y-2 max-h-40 overflow-y-auto mb-3">
  {% if docs %}
    {% for doc in docs %}
    <div class="bg-white rounded-lg px-3 py-2.5 border border-gray-100 flex items-start gap-2 group">
      <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <div class="flex-1 min-w-0">
        <div class="text-sm font-medium text-gray-800 truncate">{{ doc.title }}</div>
        <div class="text-xs text-gray-400">{{ doc.document_type.value }} · {{ doc.file_path }}</div>
      </div>
      <button hx-delete="{{ delete_url_prefix }}/{{ doc.id }}"
              hx-target="closest [data-docs-container]"
              hx-swap="innerHTML"
              hx-confirm="Remove this document?"
              class="flex-shrink-0 text-gray-300 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity mt-0.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    {% endfor %}
  {% else %}
  <div class="text-sm text-gray-400 text-center py-2">No documents attached.</div>
  {% endif %}
</div>
<form hx-post="{{ post_url }}"
      hx-target="closest [data-docs-container]"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()"
      class="space-y-2">
  <div class="flex gap-2">
    <input type="text" name="title" placeholder="Document title" required
           class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white" />
    <select name="doc_type"
            class="border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
      <option value="contract">Contract</option>
      <option value="warranty">Warranty</option>
      <option value="insurance">Insurance</option>
      <option value="permit">Permit</option>
      <option value="other" selected>Other</option>
    </select>
  </div>
  <div class="flex gap-2">
    <input type="text" name="file_path" placeholder="File path or URL" required
           class="flex-1 border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white" />
    <button type="submit"
            class="px-3 py-1.5 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors flex-shrink-0">
      Attach
    </button>
  </div>
</form>
