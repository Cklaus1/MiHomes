{% if issues %}
<div class="overflow-x-auto">
<table class="w-full text-sm">
  <thead>
    <tr class="border-b border-gray-100">
      <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Issue</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">Property</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Severity</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">Reported</th>
      <th class="px-4 py-3"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-gray-50">
    {% for issue in issues %}
    {% include "partials/issue_row.html" %}
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<div class="px-5 py-12 text-center text-sm text-gray-400">No issues found.</div>
{% endif %}
