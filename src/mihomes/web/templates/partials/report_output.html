{% if error %}
<div class="bg-red-50 border border-red-200 rounded-xl p-5 mt-4">
  <div class="text-sm font-semibold text-red-700 mb-1">Unable to generate report</div>
  <div class="text-sm text-red-600">{{ error }}</div>
</div>
{% else %}
<div class="bg-white rounded-xl border border-gray-200 overflow-hidden mt-4">

  <!-- Report header -->
  <div class="px-6 py-4 border-b border-gray-100 flex items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="px-2 py-0.5 rounded text-xs font-semibold bg-brand-100 text-brand-700">{{ report_type }}</span>
        <h2 class="text-sm font-semibold text-gray-900">{{ subject }}</h2>
      </div>
      <p class="text-xs text-gray-400 mt-0.5">Generated {{ generated_at }}</p>
    </div>
    <div class="flex items-center gap-2 flex-shrink-0">
      <!-- Save to Documents -->
      <div id="save-report-btn">
        <form hx-post="/ai/save-report"
              hx-target="#save-report-btn"
              hx-swap="outerHTML">
          <input type="hidden" name="report_type"   value="{{ report_type }}">
          <input type="hidden" name="subject"        value="{{ subject }}">
          <input type="hidden" name="generated_at"   value="{{ generated_at }}">
          <input type="hidden" name="property_slug"  value="{{ property_slug }}">
          <textarea name="report_text" class="hidden">{{ report_text }}</textarea>
          <button type="submit"
                  class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-indigo-700
                         border border-indigo-200 rounded-lg hover:bg-indigo-50 transition-colors bg-white">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
            </svg>
            Save to Documents
          </button>
        </form>
      </div>
      <!-- Print -->
      <button onclick="window.print()"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-500
                     border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
        </svg>
        Print
      </button>
    </div>
  </div>

  <!-- Report body — markdown rendered client-side via marked.js -->
  <div class="px-6 py-5 report-prose" data-markdown>{{ report_text }}</div>

</div>
{% endif %}
