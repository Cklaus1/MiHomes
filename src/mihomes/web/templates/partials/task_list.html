{% if tasks %}
<table class="w-full text-sm">
  <thead>
    <tr class="border-b border-gray-100">
      <th class="px-5 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Task</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">Property</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">Due</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Priority</th>
      <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
      <th class="px-4 py-3"></th>
    </tr>
  </thead>
  <tbody class="divide-y divide-gray-50">
    {% for task in tasks %}
    {% include "partials/task_row.html" %}
    {% endfor %}
  </tbody>
</table>
{% else %}
<div class="px-5 py-12 text-center text-sm text-gray-400">No tasks found.</div>
{% endif %}
